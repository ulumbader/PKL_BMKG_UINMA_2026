<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="sunGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD93D"/>
      <stop offset="100%" stop-color="#F5A623"/>
    </linearGradient>
    <linearGradient id="rayGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD93D"/>
      <stop offset="100%" stop-color="#F5A623"/>
    </linearGradient>
  </defs>
  <!-- Sun rays -->
  <rect x="244" y="60" width="24" height="64" rx="12" fill="url(#rayGrad)" transform="rotate(0 256 256)"/>
  <rect x="244" y="60" width="24" height="64" rx="12" fill="url(#rayGrad)" transform="rotate(45 256 256)"/>
  <rect x="244" y="60" width="24" height="64" rx="12" fill="url(#rayGrad)" transform="rotate(90 256 256)"/>
  <rect x="244" y="60" width="24" height="64" rx="12" fill="url(#rayGrad)" transform="rotate(135 256 256)"/>
  <rect x="244" y="60" width="24" height="64" rx="12" fill="url(#rayGrad)" transform="rotate(180 256 256)"/>
  <rect x="244" y="60" width="24" height="64" rx="12" fill="url(#rayGrad)" transform="rotate(225 256 256)"/>
  <rect x="244" y="60" width="24" height="64" rx="12" fill="url(#rayGrad)" transform="rotate(270 256 256)"/>
  <rect x="244" y="60" width="24" height="64" rx="12" fill="url(#rayGrad)" transform="rotate(315 256 256)"/>
  <!-- Sun circle -->
  <circle cx="256" cy="256" r="110" fill="url(#sunGrad)"/>
